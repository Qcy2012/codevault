<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeVault - 代码片段</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth"></nav>
  </header>

  <main class="container">
    <section class="toolbar card">
      <input id="search" type="search" placeholder="搜索标题、说明、代码...">
      <select id="language">
        <option value="">全部语言</option>
        <option value="cpp">C++</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="other">其他</option>
      </select>
      <select id="scope">
        <option value="public">公开片段</option>
        <option value="mine">我的片段</option>
        <option value="favorites">我的收藏</option>
      </select>
      <a class="button" href="edit.html">+ 发布片段</a>
    </section>

    <section id="list" class="list"></section>
    <div id="pager" class="pager"></div>
    <p id="empty" class="empty hidden">暂无片段</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
