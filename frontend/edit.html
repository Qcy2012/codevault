<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布片段 - CodeVault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth"></nav>
  </header>

  <main class="container">
    <h1>发布片段</h1>
    <form id="edit-form" class="card form">
      <label>标题 <input name="title" required maxlength="200"></label>

      <label>语言
        <select name="language">
          <option value="cpp">C++</option>
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="other">其他</option>
        </select>
      </label>

      <label>标签（逗号分隔） <input name="tags" placeholder="cpp, 并发, RAII"></label>
      <label>说明（Markdown） <textarea name="description" rows="5"></textarea></label>
      <label>代码 <textarea name="code" rows="15" required></textarea></label>
      <label class="inline"><input type="checkbox" name="is_public" checked> 公开</label>

      <button type="submit">保存</button>
      <p id="msg" class="message"></p>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
