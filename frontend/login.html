<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - CodeVault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth"></nav>
  </header>

  <main class="container narrow">
    <h1>登录</h1>
    <form id="login-form" class="card form">
      <label>邮箱 <input type="email" name="email" required></label>
      <label>密码 <input type="password" name="password" required minlength="6"></label>
      <button type="submit">登录</button>
      <p id="msg" class="message"></p>
      <p>还没有账号？<a href="register.html">注册</a></p>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", handleLogin);
  </script>
</body>
</html>
