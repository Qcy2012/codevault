<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的主页 - CodeVault</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth"></nav>
  </header>

  <main class="container">
    <h1>我的主页</h1>
    
    <div class="toolbar card" style="margin-bottom: 24px;">
      <button id="tab-mine" class="active">我发布的</button>
      <button id="tab-fav" style="background: #475569;">我收藏的</button>
      <button id="tab-trash" style="background: #475569;">回收站</button>
    </div>

    <!-- 开发者设置面板 -->
    <div id="dev-panel" class="card hidden" style="margin-bottom: 24px;">
      <h3>API Key 管理</h3>
      <p class="muted" style="font-size: 14px;">使用此 Key 可以通过外部脚本（如 Python、Postman）直接向 CodeVault 推送代码。</p>
      
      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <input type="text" id="api-key-input" readonly style="flex: 1; font-family: monospace;" placeholder="点击右侧按钮生成...">
        <button id="gen-key-btn">生成新 Key</button>
      </div>

      <div style="margin-top: 24px;">
        <h4>使用示例 (cURL):</h4>
        <pre style="background: var(--pre-bg); padding: 12px; border-radius: 6px; overflow-x: auto;"><code>curl -X POST ${location.origin}/api/snippets \
  -H "Content-Type: application/json" \
  -H "X-API-KEY: 你的API_KEY" \
  -d '{"title":"脚本自动推送","language":"python","code":"print(1)","is_public":true}'</code></pre>
      </div>
    </div>

    <section id="list" class="list"></section>
    <div id="pager" class="pager"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/me.js"></script>
</body>
</html>
