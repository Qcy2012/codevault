<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - CodeVault</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 0; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { background: var(--card-bg); color: var(--muted); font-weight: 600; }
    tr:hover { background: rgba(56, 189, 248, 0.05); }
    
    .tab-btn { 
      padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; 
      font-size: 14px; font-weight: 600; transition: all 0.2s; background: var(--card-bg); color: var(--text-color);
    }
    .tab-btn.active { background: #0284c7 !important; color: #fff !important; border-color: #0369a1 !important; }

    /* =========================================
       专属 Tab 按钮质感
       ========================================= */
    
    /* 未选中态的常态 */
    .tab-btn:not(.active) {
      background: var(--card-bg) !important;
      color: var(--text-color) !important;
      border-color: var(--border-color) !important;
    }

    /* 选中态的常态 */
    .tab-btn.active {
      background: #0284c7 !important;
      color: #fff !important;
      border-color: #0369a1 !important;
    }

    /* 鼠标悬浮：保留上浮和荧光，但不改变颜色 */
    .tab-btn:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3) !important;
    }
    
    /* 强制覆盖全局悬浮颜色，保证不“高亮” */
    .tab-btn:not(.active):hover {
      background: var(--card-bg) !important;
      color: var(--text-color) !important;
    }
    .tab-btn.active:hover {
      background: #0284c7 !important;
      color: #fff !important;
    }

    /* 按下时的 Q 弹感 */
    .tab-btn:active {
      transform: translateY(1px) scale(0.97) !important;
      box-shadow: 0 1px 3px rgba(2, 132, 199, 0.3) !important;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth" style="margin-left: auto;"></nav>
  </header>

  <main class="container" style="max-width: 1200px;">
    <h1>管理后台</h1>
    
    <!-- Tab 切换栏：直接内联 onclick 绑定 -->
    <div style="display: flex; gap: 12px; margin-bottom: 24px;">
      <button id="tab-snippets" class="tab-btn active" onclick="switchPanel('snippets')">📦 代码管理</button>
      <button id="tab-logs" class="tab-btn" onclick="switchPanel('logs')">📜 操作日志</button>
    </div>

    <!-- 面板 1：代码管理 -->
    <div id="panel-snippets" class="card" style="padding: 0; overflow: hidden; display: block;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>标题</th>
            <th>作者</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="admin-table-body">
          <tr><td colspan="5" style="text-align: center;">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 面板 2：操作日志 -->
    <div id="panel-logs" class="card" style="padding: 0; overflow: hidden; display: none;">
      <table>
        <thead>
          <tr>
            <th style="width: 150px;">时间</th>
            <th style="width: 120px;">操作人</th>
            <th style="width: 150px;">动作</th>
            <th>详情</th>
            <th style="width: 120px;">IP</th>
          </tr>
        </thead>
        <tbody id="logs-table-body">
          <tr><td colspan="5" style="text-align: center;">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- 引入脚本：加上 v=3 强制跳过缓存 -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js?v=3"></script>
</body>
</html>
