<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
  <meta charset="UTF-8">
  <title>系统状态 - CodeVault</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .status-grid { display: grid; grid-template-columns: repeat(30, 1fr); gap: 4px; margin: 20px 0; }
    .status-bar {
      height: 30px;
      border-radius: 3px;
      background: #10b981;
      transition: transform 0.2s;
    }
    .status-bar:hover { transform: scale(1.1); z-index: 10; }
    .status-bar.down { background: #ef4444; }
    .status-bar.empty { background: var(--border-color); }
    
    .incident-card {
      border-left: 4px solid #f59e0b;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .incident-card.resolved { border-left-color: #10b981; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth"></nav>
  </header>

  <main class="container" style="max-width: 1000px;">
    <h1 style="margin-top: 20px;">系统状态 (Server Status)</h1>
    <p class="muted">实时监控 CodeVault 系统运行状况。数据每天更新。</p>

    <div class="card" style="padding: 24px;">
      <h3 style="margin-top: 0;">过去 30 天可用率</h3>
      <div class="status-grid" id="status-grid"></div>
      <div style="display: flex; justify-content: space-between; color: var(--muted); font-size: 14px;">
        <span>30 天前</span>
        <span>今日</span>
      </div>
    </div>

    <h3 style="margin-top: 32px;">Incident 历史记录</h3>
    <div id="incident-list"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/status.js"></script>
</body>
</html>
