<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>片段详情 - CodeVault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth"></nav>
  </header>

  <main class="container">
    <div id="detail"></div>
    
    <!-- 评论区 -->
    <section id="comments-section" class="card" style="margin-top: 24px;">
      <h3>💬 评论</h3>
      
      <!-- 发表评论 -->
      <div id="comment-form-container" style="margin-bottom: 24px;">
        <textarea id="comment-input" rows="3" placeholder="留下你的高见..." style="width: 100%; margin-bottom: 8px;"></textarea>
        <button id="submit-comment-btn">发送评论</button>
      </div>
      
      <!-- 评论列表 -->
      <div id="comments-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.0/dist/purify.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/snippet.js"></script>
</body>
</html>
