<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>片段详情 - CodeVault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css">
  <style>
    /* 新增：代码区与大纲的两栏布局 */
    .code-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-top: 16px;
    }
    .code-area {
      flex: 1;
      min-width: 0;
    }
    .outline-area {
      width: 220px;
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      position: sticky;
      top: 24px; /* 悬浮在屏幕上方 */
      max-height: calc(100vh - 48px);
      overflow-y: auto;
    }
    .outline-item {
      display: block;
      padding: 4px 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }
    .outline-item:hover {
      background: var(--nav-btn-bg);
      color: #38bdf8;
    }
    .outline-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--text-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    /* 代码行高亮闪烁动画 */
    @keyframes flash {
      0% { background: rgba(56, 189, 248, 0.4); }
      100% { background: transparent; }
    }
    .code-line-flash {
      animation: flash 1s ease-out;
      display: inline-block;
      width: 100%;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth"></nav>
  </header>

  <main class="container">
    <div id="detail"></div>
    
    <!-- 评论区 -->
    <section id="comments-section" class="card" style="margin-top: 24px;">
      <h3>💬 评论</h3>
      
      <!-- 发表评论 -->
      <div id="comment-form-container" style="margin-bottom: 24px;">
        <textarea id="comment-input" rows="3" placeholder="留下你的高见..." style="width: 100%; margin-bottom: 8px;"></textarea>
        <button id="submit-comment-btn">发送评论</button>
      </div>
      
      <!-- 评论列表 -->
      <div id="comments-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.0/dist/purify.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/snippet.js"></script>
</body>
</html>
