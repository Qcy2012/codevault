<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 开发者文档 - CodeVault</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Swagger UI 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui.css">
  
  <style>
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    
    .swagger-ui { font-family: inherit; }
    
    /* ==========================================
       1. 根除白块与背景色统一
       ========================================== */
    .swagger-ui .scheme-container {
      background: var(--card-bg) !important;
      box-shadow: none !important;
      border-bottom: 1px solid var(--border-color) !important;
      padding: 20px 0 !important;
      margin-bottom: 20px;
    }
    
    /* ==========================================
       2. 暴力统一所有文字颜色 (修复浅色模式看不见)
       ========================================== */
    .swagger-ui .info .title,
    .swagger-ui .opblock-tag,
    .swagger-ui .opblock-summary-path,
    .swagger-ui .opblock-summary-path__deprecated,
    .swagger-ui .parameter__name,
    .swagger-ui .response-col_status,
    .swagger-ui .model-title,
    .swagger-ui .property-row,
    .swagger-ui .tab li,
    .swagger-ui label,
    .swagger-ui table thead tr th,
    .swagger-ui table tbody tr td {
      color: var(--text-color) !important;
    }

    .swagger-ui .info p, 
    .swagger-ui .info a,
    .swagger-ui .opblock-summary-description,
    .swagger-ui .response-col_links {
      color: var(--muted) !important;
    }

    /* 修复标题旁边的版本标签和 OAS 标签 */
    .swagger-ui .info .title small,
    .swagger-ui .info .title small.version-stamp {
      background: var(--border-color) !important;
      color: var(--text-color) !important;
      border-radius: 4px;
      text-shadow: none !important;
    }

    /* ==========================================
       3. 修复深色模式下的黑色箭头和图标 (最痛点)
       ========================================== */
    .swagger-ui .expand-operation svg,
    .swagger-ui .models-control svg,
    .swagger-ui .authorization__btn svg,
    .swagger-ui .btn svg,
    .swagger-ui .arrow {
      fill: var(--text-color) !important;
      stroke: var(--text-color) !important;
    }

    /* ==========================================
       4. 彻底重绘 Servers 下拉框
       ========================================== */
    .swagger-ui .scheme-container select,
    .swagger-ui .scheme-container .servers select {
      appearance: none !important;
      -webkit-appearance: none !important;
      background-color: var(--input-bg) !important;
      color: var(--text-color) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px !important;
      padding: 8px 36px 8px 12px !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      cursor: pointer;
      box-shadow: none !important;
      transition: all 0.2s;
      
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E") !important;
      background-repeat: no-repeat !important;
      background-position: right 12px center !important;
      background-size: 16px !important;
    }
    
    .swagger-ui .scheme-container select:focus {
      outline: none !important;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2) !important;
    }

    /* ==========================================
       5. 按钮与卡片质感
       ========================================== */
    .swagger-ui .btn.authorize {
      background-color: #0284c7 !important;
      color: white !important;
      border-color: #0369a1 !important;
      border-radius: 6px !important;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
    }
    .swagger-ui .btn.authorize:hover { background-color: #0369a1 !important; transform: translateY(-1px); }
    .swagger-ui .btn.authorize svg { fill: white !important; stroke: white !important; }
    
    .swagger-ui .opblock-tag { border-bottom: 1px solid var(--border-color); }
    .swagger-ui .opblock-tag:hover { background: rgba(56, 189, 248, 0.05); }
    .swagger-ui .opblock { background: var(--card-bg) !important; border-color: var(--border-color) !important; border-radius: 8px; }
    .swagger-ui .opblock .opblock-summary { border-bottom: none; }
    .swagger-ui .opblock-body { background: var(--input-bg) !important; }
    
    .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #0284c7; border-radius: 4px; }
    .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #10b981; border-radius: 4px; }
    
    .swagger-ui select, 
    .swagger-ui input[type=text],
    .swagger-ui textarea { 
      background: var(--input-bg) !important; 
      color: var(--text-color) !important; 
      border: 1px solid var(--border-color) !important; 
      border-radius: 4px;
    }
    
    .swagger-ui .model-box { background: rgba(0,0,0,0.2) !important; border-radius: 6px; }
    .swagger-ui table thead tr td, 
    .swagger-ui table thead tr th { border-color: var(--border-color); }
    
    /* 响应区代码块美化 */
    .swagger-ui .opblock-body pre.microlight,
    .swagger-ui .opblock-body .highlight-code pre {
      background: var(--card-bg) !important;
      color: #38bdf8 !important;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }
    
    /* 亮色模式微调 */
    [data-theme="light"] .swagger-ui .opblock-body { background: #f8fafc !important; }
    [data-theme="light"] .swagger-ui .highlight-code { background: #fff !important; }
    [data-theme="light"] .swagger-ui .model-box { background: #f1f5f9 !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth" style="margin-left: auto;"></nav>
  </header>

  <main class="container" style="max-width: 1200px;">
    <div id="swagger-ui"></div>
  </main>

  <!-- 引入 Swagger UI 脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    window.onload = () => {
      // 动态获取当前的 host，支持本地和线上
      const currentServer = window.location.origin;
      
      // 初始化 Swagger UI
      window.ui = SwaggerUIBundle({
        url: "openapi.json", // 读取我们写的配置文件
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        // 自动替换 server 地址为当前访问的地址
        onComplete: function() {
          const servers = document.querySelectorAll('.servers select');
          if(servers.length > 0) {
             // 如果当前是线上域名，Swagger 会默认选中第一个，但为了保险，我们手动处理
          }
        }
      });
    };
  </script>
</body>
</html>
