<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布片段 - CodeVault</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- CodeMirror 核心样式与主题 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  
  <style>
    /* 覆盖 CodeMirror 的一些默认样式，让它融入暗黑主题 */
    .CodeMirror {
      height: 400px;
      border-radius: 6px;
      font-family: 'Consolas', 'Cascadia Code', monospace;
      font-size: 15px;
      border: 1px solid #475569;
    }
    
    /* Markdown 双屏布局 */
    .editor-split {
      display: flex;
      gap: 16px;
      min-height: 200px;
    }
    .editor-split textarea, .editor-split .preview {
      flex: 1;
      width: 50%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: inherit;
      resize: vertical;
    }
    .editor-split .preview {
      overflow-y: auto;
      background: #1e293b;
    }
    .editor-split .preview p { margin-top: 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth"></nav>
  </header>

  <main class="container" style="max-width: 1000px;">
    <h1>发布片段</h1>
    <form id="edit-form" class="card form">
      <label>标题 <input name="title" required maxlength="200" placeholder="给这段代码起个名字"></label>

      <label>语言
        <select name="language" id="lang-select">
          <option value="cpp">C++</option>
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="other">其他</option>
        </select>
      </label>

      <label>标签（逗号分隔） <input name="tags" placeholder="cpp, 并发, RAII"></label>
      
      <label>说明（Markdown 实时预览）</label>
      <div class="editor-split">
        <textarea name="description" id="desc-input" rows="8" placeholder="支持 Markdown 语法..."></textarea>
        <div class="preview markdown" id="desc-preview">预览区</div>
      </div>

      <label>代码</label>
      <!-- 这里的 textarea 会被 CodeMirror 隐藏并替换 -->
      <textarea name="code" id="code-input"></textarea>

      <label class="inline" style="margin-top: 12px;">
        <input type="checkbox" name="is_public" checked> 公开
      </label>

      <button type="submit" style="margin-top: 16px; font-size: 16px;">保存并发布</button>
      <p id="msg" class="message"></p>
    </form>
  </main>

  <!-- 引入 marked 和 DOMPurify 用于 Markdown 预览 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.0/dist/purify.min.js"></script>

  <!-- 引入 CodeMirror 核心与依赖 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <!-- 语言模式 (C++, JS, Python, HTML, CSS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <!-- 增强功能：括号匹配与自动闭合 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
