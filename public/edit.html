<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布片段 - CodeVault</title>
  <link rel="stylesheet" href="css/style.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  
  <style>
    .CodeMirror { height: 400px; border-radius: 6px; font-family: 'Consolas', 'Cascadia Code', monospace; font-size: 15px; border: 1px solid var(--border-color); }
    .editor-split { display: flex; gap: 16px; min-height: 200px; }
    .editor-split textarea, .editor-split .preview { flex: 1; width: 50%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-color); font-family: inherit; resize: vertical; }
    .editor-split .preview { overflow-y: auto; background: var(--card-bg); }
    .editor-split .preview p { margin-top: 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">CodeVault</a>
    <nav id="nav-auth"></nav>
  </header>

  <main class="container" style="max-width: 1000px;">
    <h1>发布片段</h1>
    <form id="edit-form" class="card form">
      <label>标题 <input name="title" required maxlength="200" placeholder="给这段代码起个名字"></label>

      <label>语言
        <select name="language" id="lang-select">
          <option value="cpp">C++</option>
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="other">其他</option>
        </select>
      </label>

      <label>标签（逗号分隔） <input name="tags" placeholder="cpp, 并发, RAII"></label>
      
      <label>说明（Markdown 实时预览）</label>
      <div class="editor-split">
        <textarea name="description" id="desc-input" rows="8" placeholder="支持 Markdown 语法..."></textarea>
        <div class="preview markdown" id="desc-preview">预览区</div>
      </div>

      <label>项目文件</label>
      <div id="file-tabs" style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;"></div>
      <button type="button" id="add-file-btn" style="margin-bottom: 12px; padding: 4px 10px; font-size: 13px;">+ 添加文件</button>

      <textarea name="code" id="code-input"></textarea>

      <div style="display: flex; gap: 20px; align-items: flex-end; margin-top: 12px; flex-wrap: wrap;">
        <label class="inline" style="margin: 0;">
          <input type="checkbox" name="is_public" checked> 公开
        </label>
        
        <label style="margin: 0; flex: 1; min-width: 150px;">
          访问密码 (可选) <input type="password" name="password" placeholder="留空则无密码">
        </label>

        <label style="margin: 0; flex: 1; min-width: 150px;">
          阅后即销毁 (最大查看次数) <input type="number" name="max_views" value="0" min="0" placeholder="0 为不限次数">
        </label>

        <label style="margin: 0; flex: 1; min-width: 150px;">
          过期时间 (可选) <input type="datetime-local" name="expires_at">
        </label>
      </div>

      <button type="submit" style="margin-top: 16px; font-size: 16px;">保存并发布</button>
      <p id="msg" class="message"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.0/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/edit.js"></script>
</body>
</html>
